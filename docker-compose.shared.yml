# One-time shared services for multi-tenant hosting: a single Postgres instance holding one
# database per student, a single MinIO instance holding one bucket per student, and the single
# public Caddy listener that fronts every student's subdomain plus the shared s3 subdomain.
# Bring up once per box, before provisioning any tenant. See docs/deploy-multi-tenant.md.
networks:
  tenants-net:
    name: tenants-net

# Docker's json-file logs otherwise grow without bound on the VPS disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SHARED_POSTGRES_ADMIN_USER:?set SHARED_POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${SHARED_POSTGRES_ADMIN_PASSWORD:?set SHARED_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes: [shared_pgdata:/var/lib/postgresql/data]
    networks: [tenants-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHARED_POSTGRES_ADMIN_USER:?set SHARED_POSTGRES_ADMIN_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    logging: *default-logging
    # Docker Hub's minio/minio now denies anonymous pulls; quay.io mirror still works.
    image: quay.io/minio/minio
    container_name: shared-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SHARED_MINIO_ROOT_USER:?set SHARED_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SHARED_MINIO_ROOT_PASSWORD:?set SHARED_MINIO_ROOT_PASSWORD}
    volumes: [shared_miniodata:/data]
    networks: [tenants-net]

  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    container_name: shared-caddy
    restart: unless-stopped
    # Internal-only: host nginx already owns 80/443 for other products on this box and
    # terminates TLS for *.crm.estrategistacrm.com.br with its own wildcard cert, then
    # proxy_passes plain HTTP here. See the note at the top of caddy/Caddyfile.tenants.
    ports:
      - "127.0.0.1:8880:80"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    # DIRECTORY mount, not a single-file mount: provision-tenant.sh/deprovision-tenant.sh edit
    # caddy/Caddyfile.tenants with sed -i, which rewrites it via a new inode (temp file + rename).
    # A single-file bind mount stays pinned to the OLD inode when that happens, so the container
    # silently keeps serving a frozen snapshot forever after the first edit, no error, no `caddy
    # reload` fixes it, only a container recreate does (see the incident this comment postdates:
    # every deploy between provisioning "teste1"/"teste-lifecycle" and this comment was routed by
    # a Caddy that had stopped seeing new tenant blocks). A directory mount has no such inode
    # pinning: whatever file currently sits at that path within it is what gets read.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.tenants", "--adapter", "caddyfile"]
    volumes:
      - ./caddy:/etc/caddy:ro
      - shared_caddydata:/data
      - shared_caddyconfig:/config
    networks: [tenants-net]
    depends_on:
      minio:
        condition: service_started

  mail-oauth-relay:
    logging: *default-logging
    build: ./mail-oauth-relay
    container_name: shared-mail-oauth-relay
    restart: unless-stopped
    # Internal-only, same shape as Caddy above: nginx (host) owns 80/443 and proxy_passes ONLY
    # /api/mail-oauth/google/callback and /api/mail-oauth/microsoft/callback here (prefix stripped).
    # /connect-init and /claim stay reachable only from tenant apps on tenants-net. The relay never
    # touches tenant databases or keys: the tenant app claims each finished consent and stores it.
    # Free replacement for the old Nylas relay: see mail-oauth-relay/server.mjs and docs/PROJETO.md.
    ports:
      - "127.0.0.1:8881:8081"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN}
      MAIL_OAUTH_RELAY_SECRET: ${MAIL_OAUTH_RELAY_SECRET:?set MAIL_OAUTH_RELAY_SECRET}
      # Empty disables that provider's button (connect-init answers 503).
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      # Only for its own bookkeeping database (warpdrive_ops).
      SHARED_POSTGRES_ADMIN_USER: ${SHARED_POSTGRES_ADMIN_USER:?set SHARED_POSTGRES_ADMIN_USER}
      SHARED_POSTGRES_ADMIN_PASSWORD: ${SHARED_POSTGRES_ADMIN_PASSWORD:?set SHARED_POSTGRES_ADMIN_PASSWORD}
    networks: [tenants-net]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shared_pgdata:
  shared_miniodata:
  shared_caddydata:
  shared_caddyconfig:
